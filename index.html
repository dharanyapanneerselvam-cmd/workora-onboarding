<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note Application</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <h2>Quick Note Application</h2>
    <textarea id="noteInput" placeholder="Write a note..."></textarea>
    <button onclick="addNote()">Add Note</button>
    <ul id="notesList"></ul>

    <script>
        function addNote() {
            let input = document.getElementById('noteInput');
            if (input.value.trim() === '') return;
            let li = document.createElement('li');
            li.textContent = input.value;
            document.getElementById('notesList').appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
