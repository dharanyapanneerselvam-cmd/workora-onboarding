<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication & JWT Demo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .token-box { background: #e9ecef; word-break: break-all; padding: 10px; font-size: 12px; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>🔒 User Authentication</h2>
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login & Generate JWT Token</button>

    <div id="output" style="display:none;">
        <h3>Generated Token:</h3>
        <div class="token-box" id="tokenDisplay"></div>
        <button onclick="logout()" style="background: #dc3545;">Logout</button>
    </div>

    <script>
        function login() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            if (!user || !pass) return alert('Please enter credentials!');

            // Mock JWT Token generation for demonstration
            let fakeJwt = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9." + btoa(JSON.stringify({ user: user, role: "student" })) + ".SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
            
            document.getElementById('tokenDisplay').textContent = fakeJwt;
            document.getElementById('output').style.display = 'block';
        }

        function logout() {
            document.getElementById('output').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
